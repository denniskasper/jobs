<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tick of favicon.svg, with a dot in its corner while an answer waits to be seen: in the
       stylesheet's red pencil, ringed in the page's own ground so it stands off the tick. -->
  <style>
    rect { fill: #2338B8; }
    circle { fill: #B3261E; stroke: #ECEDE7; }
    @media (prefers-color-scheme: dark) {
      rect { fill: #9AABFF; }
      circle { fill: #FF8E7F; stroke: #15171D; }
    }
  </style>
  <rect width="32" height="32" rx="7"/>
  <path d="M8.5 16.75 L13.75 22 L23.5 10.5" fill="none" stroke="#FCFCFA" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="7" r="6" stroke-width="2"/>
</svg>
